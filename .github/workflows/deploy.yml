name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Droplet and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /root/ai-trading-alltime-record
            git pull origin main
            # Free disk before build. --no-cache builds + frequent pushes
            # otherwise pile up dangling layers until the 33GB volume runs
            # out (last failure: 12:13 UTC, 2026-06-10). Safe on a single-
            # container deploy — only prunes unused images / build cache.
            df -h /
            docker system prune -af --volumes
            df -h /
            # --remove-orphans clears containers left behind by profile
            # changes; the explicit rm is the fallback for a container stuck in
            # Created state, which `down` does not always remove and which then
            # fails the next `up` with "container name is already in use".
            # deploy.sh has always done this; the workflow did not.
            docker compose --profile collectors --profile nse down --remove-orphans || true
            docker compose down --remove-orphans || true
            for c in api collector collector-banknifty collector-finnifty collector-sensex nse-runner; do
              docker rm -f "ai-trading-alltime-record-$c-1" 2>/dev/null || true
            done
            # Drop --no-cache: with the new .dockerignore the build context
            # is small (≈4MB) and layer caching is correct, so cache reuse
            # cuts deploy time from ~60s to ~10s without staleness risk.
            # NOTE: plain `docker compose build` skips profile-gated
            # services, so collector images must be listed explicitly —
            # otherwise `up --force-recreate` recreates collectors from
            # stale images (the 2026-07-16 collector breakage survived
            # every deploy until 2026-07-28 because of this).
            docker compose build api collector collector-banknifty collector-finnifty collector-sensex
            docker compose up -d --force-recreate
            # Keep option-chain collectors alive; do NOT auto-start nse-runner.
            docker compose --profile collectors up -d --force-recreate
