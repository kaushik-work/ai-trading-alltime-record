services:

  api:
    build: .
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./backtest_cache:/app/backtest_cache
      - app_data:/app/db
      - app_logs:/app/logs
      - app_journals:/app/journals
    restart: unless-stopped

  # ── 5-min option chain snapshot collector ──────────────────────────────────
  # Runs 24/7 on the droplet (no Windows / laptop dependency).
  # Daily routine inside the container: wait for 09:10 IST, collect every 5 min
  # until 15:35 IST, write CSV (db/oi_snapshots/) AND mirror each snapshot to
  # MongoDB (option_snapshots collection) for queryable historical premium data.
  # The script auto-exits on weekends/holidays; the wrapper restarts it daily
  # at 09:00 IST so we don't need to script docker restart externally.
  # NSE collectors are gated behind the "collectors" compose profile so a regular
  # `docker compose up -d` only starts the crypto api on a small droplet.
  # To enable them: `docker compose --profile collectors up -d`.
  # The legacy "nse" profile still exists for the synthetic-forward live runner.
  collector:
    build: .
    profiles: ["collectors", "nse"]
    command: >
      sh -c '
        while true; do
          NOW=$$(date -u +%H%M)
          if [ "$$NOW" -ge "0330" ] && [ "$$NOW" -lt "1015" ]; then
            python scripts/collect_option_snapshots.py --symbol NIFTY --interval 5 --strikes 8 --expiries 2 --greeks --vix || sleep 60
          else
            sleep 60
          fi
        done
      '
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - app_data:/app/db
      - app_logs:/app/logs
    restart: unless-stopped
    depends_on:
      - api

  collector-banknifty:
    build: .
    profiles: ["collectors", "nse"]
    command: >
      sh -c '
        while true; do
          NOW=$$(date -u +%H%M)
          if [ "$$NOW" -ge "0330" ] && [ "$$NOW" -lt "1015" ]; then
            python scripts/collect_option_snapshots.py --symbol BANKNIFTY --interval 5 --strikes 8 --expiries 2 --greeks --vix || sleep 60
          else
            sleep 60
          fi
        done
      '
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - app_data:/app/db
      - app_logs:/app/logs
    restart: unless-stopped
    depends_on:
      - api

  collector-finnifty:
    build: .
    profiles: ["collectors", "nse"]
    command: >
      sh -c '
        while true; do
          NOW=$$(date -u +%H%M)
          if [ "$$NOW" -ge "0330" ] && [ "$$NOW" -lt "1015" ]; then
            python scripts/collect_option_snapshots.py --symbol FINNIFTY --interval 5 --strikes 8 --expiries 2 --greeks --vix || sleep 60
          else
            sleep 60
          fi
        done
      '
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - app_data:/app/db
      - app_logs:/app/logs
    restart: unless-stopped
    depends_on:
      - api

  # SENSEX trades on BFO, which did NOT extend to 15:40 — it still closes at
  # 15:30 IST. Gate stays at 1005 UTC (15:35 IST) to match the collector's own
  # BFO close; widening it would hot-restart the script for 10 idle minutes.
  collector-sensex:
    build: .
    profiles: ["collectors", "nse"]
    command: >
      sh -c '
        while true; do
          NOW=$$(date -u +%H%M)
          if [ "$$NOW" -ge "0330" ] && [ "$$NOW" -lt "1005" ]; then
            python scripts/collect_option_snapshots.py --symbol SENSEX --interval 5 --strikes 8 --expiries 2 --greeks --vix || sleep 60
          else
            sleep 60
          fi
        done
      '
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - app_data:/app/db
      - app_logs:/app/logs
    restart: unless-stopped
    depends_on:
      - api

  # ── NSE synthetic-forward live runner ────────────────────────────────────────
  # Always enabled when the container starts. Live only.
  # Market hours: 09:15–15:30 IST = 03:45–10:00 UTC.
  nse-runner:
    build: .
    profiles: ["nse"]
    command: >
      sh -c '
        while true; do
          NOW=$$(date -u +%H%M)
          if [ "$$NOW" -ge "0340" ] && [ "$$NOW" -lt "1005" ]; then
            python -c "from core.bot_runner import get_runner; r=get_runner(); r.start(); from nse.execution.nse_runner import init_nse_runner; init_nse_runner(r.scheduler); import time; time.sleep(36000)" || true
          else
            sleep 60
          fi
        done
      '
    env_file: .env
    volumes:
      - ./.env:/app/.env
      - app_data:/app/db
      - app_logs:/app/logs
    restart: unless-stopped
    depends_on:
      - api

  # ── EXECUTION SENTINEL (droplet only) ──────────────────────────────────────
  # The ONLY service that talks to Angel's order API. It holds the credentials,
  # the SEBI Algo-ID, and the dead-man's switch.
  #
  # NOT published to the host. `expose` makes it reachable on the compose
  # network as http://sentinel:8090 and nowhere else. Publishing it with
  # `ports:` would put an order API on the public internet behind nothing but a
  # shared secret, on a droplet whose IP is whitelisted with the broker.
  #
  # SENTINEL_LIVE_ORDERS defaults to 0. It must be set to 1 deliberately, on the
  # droplet, after the static IP is registered with Angel. A sentinel that
  # starts hot on a fresh deploy trades on a config nobody reviewed.
  sentinel:
    build: .
    profiles: ["council"]
    command: >
      python -m uvicorn sentinel.main:app --host 0.0.0.0 --port 8090
    env_file: .env
    environment:
      SENTINEL_LIVE_ORDERS: "${SENTINEL_LIVE_ORDERS:-0}"
      SENTINEL_DEADMAN_SEC: "${SENTINEL_DEADMAN_SEC:-30}"
    expose:
      - "8090"
    volumes:
      - ./.env:/app/.env
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/status',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── THE COUNCIL (brain tier) ───────────────────────────────────────────────
  # Eight lenses read the tape, deliberate, and emit signed intents. Reads
  # market data directly from Angel; the only outbound TRADING path is the
  # sentinel service above.
  #
  # brain_guard.py runs first and REFUSES TO START if this container can reach
  # an order API. On the droplet that guard is the only remaining protection:
  # the broker's IP whitelist covers this host, so unlike on a laptop, a
  # mistaken import here really would place orders.
  council:
    build: .
    profiles: ["council"]
    command: >
      sh -c '
        python docker/brain_guard.py &&
        python -m nse.execution.live_session --symbol ${COUNCIL_SYMBOL:-NIFTY} --every ${COUNCIL_EVERY:-60} ${COUNCIL_LIVE_FLAG:-}
      '
    env_file: .env
    environment:
      SENTINEL_URL: "http://sentinel:8090"
      ENABLE_OPTIONS_RUNNER: "${ENABLE_OPTIONS_RUNNER:-false}"
      # Never inherit the sentinel's arming flag. brain_guard fails the boot if
      # this is 1, because its presence means the two services share an env file
      # and the tier split is being kept by luck.
      SENTINEL_LIVE_ORDERS: "0"
    depends_on:
      sentinel:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      - app_data:/app/db
      - app_logs:/app/logs
      - app_journals:/app/journals
    restart: unless-stopped

# api handles crypto live trading via CryptoRunner.
# collector captures historical option premium data for backtest realism.
# nse-runner executes NSE synthetic-forward combos (live only).
volumes:
  app_data:
  app_logs:
  app_journals:
